name: Testes das Firebase Security Rules (Fase 5)

on:
  pull_request:
    branches:
      - main
      - v2
      - v3-quiz
  push:
    branches:
      - claude/campo-direita-navegacao-rl6h3k

jobs:
  testes-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar firebase-tools + @firebase/rules-unit-testing
        run: |
          mkdir -p /tmp/rules-deps
          cd /tmp/rules-deps
          npm init -y
          npm install firebase-tools@13 @firebase/rules-unit-testing

      # O emulador do Realtime Database roda as REGRAS DE VERDADE
      # (database.rules.json) contra chamadas reais do SDK cliente —
      # nunca uma reimplementação em JS das rules. `emulators:exec`
      # sobe o emulador, espera ficar pronto, roda o script e derruba
      # tudo, propagando o código de saída do script.
      - name: Rodar testes de rules contra o emulador real
        env:
          NODE_PATH: /tmp/rules-deps/node_modules
        run: |
          /tmp/rules-deps/node_modules/.bin/firebase emulators:exec \
            --only database \
            --project demo-kyber-agil-rules-test \
            "node .github/scripts/teste-rules.js && node .github/scripts/teste-rules-avaliacoes.js && node .github/scripts/teste-rules-taxonomia.js && node .github/scripts/teste-rules-taxonomia-definicoes.js && node .github/scripts/teste-rules-taxonomia-governanca.js && node .github/scripts/teste-rules-perfis-avaliacao.js && node .github/scripts/teste-rules-posicionamento.js && node .github/scripts/teste-rules-posicionamento-decisao.js && node .github/scripts/teste-rules-redacao-motor.js && node .github/scripts/teste-rules-governanca-motor.js && node .github/scripts/teste-rules-posicionamento-v2.js && node .github/scripts/teste-rules-squad-liberacao.js && node .github/scripts/teste-rules-estruturas-concretas.js && node .github/scripts/teste-rules-mapa-subagrupadores.js && node .github/scripts/teste-rules-objetos-organizacionais.js && node .github/scripts/teste-rules-analises-organizacionais.js && node .github/scripts/teste-rules-exclusao-cadastros.js && node .github/scripts/teste-rules-estrutura-atual.js && node .github/scripts/teste-rules-relacoes-objetos.js && node .github/scripts/teste-rules-versao-vigente.js && node .github/scripts/teste-reconciliar-versao-vigente.js && node .github/scripts/teste-rules-squad-exclusao.js && node .github/scripts/teste-rules-email-confirmado.js && node .github/scripts/teste-rules-fa-users-compat.js"

  # B4: a fronteira confiável (Cloud Functions) no emulador — banco, autenticação e funções, sem nada real.
  fronteira:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar firebase-tools e as dependências das funções
        run: |
          mkdir -p /tmp/rules-deps
          cd /tmp/rules-deps
          npm init -y
          npm install firebase-tools@13
          cd "$GITHUB_WORKSPACE"
          npm ci --prefix functions

      - name: Copiar os módulos do site para functions/site (o mesmo passo do predeploy)
        run: node .github/scripts/copiar-modulos-fronteira.js

      - name: Rodar a fronteira contra os emuladores (database, auth, functions)
        run: |
          /tmp/rules-deps/node_modules/.bin/firebase emulators:exec \
            --only database,auth,functions \
            --project demo-kyber-agil-fronteira \
            "node .github/scripts/teste-fronteira-posicionamento.js"
