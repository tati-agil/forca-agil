name: Diagnóstico — vazamento de grupo entre execuções (somente leitura)

# workflow_dispatch (disparo manual) só é aceito pela API do GitHub para
# um workflow já registrado na branch padrão — inútil enquanto este
# arquivo só existir aqui. Por isso também roda em push, mas restrito a
# mudanças neste próprio script/workflow, nunca em toda PR/push do
# projeto. Somente leitura: usa a mesma conta de teste admin já usada
# pela suíte automática, só para GET no Realtime Database. Nunca escreve
# nada — remover o gatilho de push depois que o diagnóstico não for mais
# necessário.
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/scripts/diagnostico-execucao-vazamento-grupo.js'
      - '.github/workflows/diagnostico-execucao-vazamento-grupo.yml'

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ler execuções de todas as turmas (somente leitura)
        env:
          FA_TEST_ADMIN_EMAIL: ${{ secrets.FA_TEST_ADMIN_EMAIL }}
          FA_TEST_ADMIN_PASSWORD: ${{ secrets.FA_TEST_ADMIN_PASSWORD }}
        run: node .github/scripts/diagnostico-execucao-vazamento-grupo.js
