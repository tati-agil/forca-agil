name: Testes automáticos (painel Admin)

# A suíte hermética (Firebase falso, sem segredo, sem rede) roda em 4 GRUPOS, cada um num runner
# próprio, todos ao mesmo tempo, todos obrigatórios:
#
#   "Testes herméticos — grupo N/4"   → bloqueiam o merge (os quatro).
#   "Smoke test — login real…"        → NÃO deve bloquear (rede, segredo, site no ar).
#
# A lista dos testes (com o motivo de cada um, que antes ficava aqui em comentário) está em
# .github/scripts/suite-hermetica.json, e quem roda é .github/scripts/rodar-suite.js:
#   - os grupos são equilibrados pela duração medida de cada teste (não pela quantidade);
#   - dentro do grupo, TODOS os testes rodam mesmo depois de uma falha, e o job só fica vermelho
#     no fim — antes, um passo que falhava fazia o GitHub pular todos os seguintes do job;
#   - fail-fast desligado: um grupo vermelho não cancela os outros, que terminam e mostram os
#     seus resultados;
#   - o runner recusa rodar se algum teste-*.js não estiver na suíte nem em "foraDaSuite" (com
#     o motivo) — nenhum teste deixa de ser obrigatório por esquecimento.
# Nenhum teste foi removido nem alterado: só mudou COMO e ONDE eles rodam.
# Dentro de cada grupo os testes rodam um por vez (--processos 1) até medirmos a capacidade real
# dos runners deste repositório (o passo "Recursos do runner" registra núcleos e memória).
# O preparo (Node, Playwright, servidor local) é um só: .github/actions/preparar-testes.
# As regras do banco são provadas à parte, no emulador real (teste-rules.yml).

on:
  pull_request:
    branches:
      - main
      - v2
      - v3-quiz

jobs:
  hermeticos:
    name: Testes herméticos — grupo ${{ matrix.grupo }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grupo: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar-testes

      - name: Recursos do runner
        run: |
          echo "núcleos (nproc): $(nproc)"
          free -m
          grep -m1 'model name' /proc/cpuinfo || true

      - name: Grupo ${{ matrix.grupo }}/4 — todos os testes do grupo, sem parar na primeira falha
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/rodar-suite.js --grupo ${{ matrix.grupo }}/4 --processos 1


  smoke-site-publicado:
    name: Smoke test — login real no site publicado (depende de rede)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar-testes

      - name: Smoke com o Firebase real (rotas principais com dados reais, sem gravar nada)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
          FA_TEST_ADMIN_EMAIL: ${{ secrets.FA_TEST_ADMIN_EMAIL }}
          FA_TEST_ADMIN_PASSWORD: ${{ secrets.FA_TEST_ADMIN_PASSWORD }}
        run: node .github/scripts/smoke-site-real.js

      - name: Guardar screenshot de erro (se houver)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-erro
          path: smoke-erro.png
          if-no-files-found: ignore
