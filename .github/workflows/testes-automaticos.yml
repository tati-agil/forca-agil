name: Testes automáticos (painel Admin)

on:
  pull_request:
    branches:
      - main
      - v2
      - v3-quiz

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright + Chromium
        run: |
          mkdir -p /tmp/pw-deps
          cd /tmp/pw-deps
          npm init -y
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Servir o site localmente
        run: |
          python3 -m http.server 8811 --bind 127.0.0.1 &
          sleep 2

      # Não precisa de navegador nem de rede: só lê os arquivos e compara o
      # que a documentação AFIRMA com o que o código faz. É o mais rápido de
      # todos, então roda primeiro.
      - name: Consistência entre documentação e implementação
        run: node .github/scripts/teste-consistencia-docs.js

      # Roda ANTES da suíte do painel: é hermético (Firebase falso, sem
      # segredo e sem rede) e cobre justamente o que a outra suíte não
      # alcança — a espera antes do login resolver. Se a tela fica preta,
      # não adianta testar o painel que vem depois dela.
      - name: Tela preta na espera do login (desktop e celular)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-tela-preta.js

      # Também hermético (Firebase falso). Confere o que só aparece na conta de
      # OUTRA pessoa: quem está fora da lista de e-mails de um evento restrito
      # não pode ver nada dele. Quem desenvolve está sempre logado como admin,
      # e admin vê tudo — por isso esta conferência é mecânica.
      - name: Público restrito do evento (desktop e celular)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-publico-restrito-evento.js

      # Hermético também. Regra: depois de tocar em "Enviar pedido", alguma
      # coisa SEMPRE muda na tela. A regressão de 11/09/2026 era justamente o
      # contrário — botão desabilitado com cara de botão vivo, toque engolido,
      # nenhuma mensagem — e no computador do escritório passava despercebida.
      - name: "Enviar pedido nunca fica calado (desktop e iPhone)"
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-pedido-envio.js

      # Hermético. Prova que corrigir um cadastro chega em TODAS as cópias do
      # nome/área (inscrição, presença, fila, listas, equipe) — e não só em
      # fa-users, que é a versão da feature que passaria despercebida.
      - name: Editar cadastro chega em todo lugar (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-editar-cadastro.js

      # Hermético. A linha da aba Cadastrados tinha uma coluna por ação e não
      # cabia na tela: os últimos botões ficavam atrás de uma rolagem lateral
      # cuja barra só aparecia no fim de uma tabela de milhares de pixels.
      # Ação que ninguém alcança é ação que não existe — e isso não dá erro.
      - name: Ações do cadastrado cabem na tela e gravam (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-acoes-cadastrado.js

      # Hermético. O Dashboard passou a responder por evento e por turma. Um
      # número agregado errado é pior que número nenhum: ele parece certo, e
      # nada na tela acusa se o filtro deixar de filtrar. As notas do banco
      # falso são escolhidas para que cada escopo tenha média diferente.
      - name: Dashboard por evento e por turma (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-dashboard-escopo.js

      # Hermético. O conteúdo do treinamento passou a poder ser escrito no
      # painel. Duas maneiras silenciosas de quebrar a tela de quem responde:
      # conteúdo pela metade chegando a ela, e a escada de patentes de um
      # treinamento aparecendo em outro (ela era HTML fixo).
      - name: Treinamento com conteúdo próprio (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-treinamento-conteudo.js

      # Hermético. A correção de e-mail é o caminho mais arriscado do painel:
      # troca o login da pessoa no Auth e depois move TODOS os dados dela de
      # uma chave para outra. Errar aqui não dá erro na tela — a pessoa só
      # descobre depois, sem inscrição, sem presença, sem os próprios pedidos.
      - name: Corrigir e-mail leva os dados junto (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-corrigir-email.js

      - name: Rodar suíte "Automáticos" de testes.js
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
          FA_TEST_ADMIN_EMAIL: ${{ secrets.FA_TEST_ADMIN_EMAIL }}
          FA_TEST_ADMIN_PASSWORD: ${{ secrets.FA_TEST_ADMIN_PASSWORD }}
        run: node .github/scripts/run-testes-automaticos.js

      - name: Guardar screenshot de erro (se houver)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testes-automaticos-erro
          path: testes-automaticos-erro.png
          if-no-files-found: ignore
