name: Testes automáticos (painel Admin)

on:
  pull_request:
    branches:
      - main
      - v2
      - v3-quiz

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright + Chromium
        run: |
          mkdir -p /tmp/pw-deps
          cd /tmp/pw-deps
          npm init -y
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Servir o site localmente
        run: |
          python3 -m http.server 8811 --bind 127.0.0.1 &
          sleep 2

      # Não precisa de navegador nem de rede: só lê os arquivos e compara o
      # que a documentação AFIRMA com o que o código faz. É o mais rápido de
      # todos, então roda primeiro.
      - name: Consistência entre documentação e implementação
        run: node .github/scripts/teste-consistencia-docs.js

      # Roda ANTES da suíte do painel: é hermético (Firebase falso, sem
      # segredo e sem rede) e cobre justamente o que a outra suíte não
      # alcança — a espera antes do login resolver. Se a tela fica preta,
      # não adianta testar o painel que vem depois dela.
      - name: Tela preta na espera do login (desktop e celular)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-tela-preta.js

      # Também hermético (Firebase falso). Confere o que só aparece na conta de
      # OUTRA pessoa: quem está fora da lista de e-mails de um evento restrito
      # não pode ver nada dele. Quem desenvolve está sempre logado como admin,
      # e admin vê tudo — por isso esta conferência é mecânica.
      - name: Público restrito do evento (desktop e celular)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-publico-restrito-evento.js

      # Hermético. Regularizar quem já está na turma (ou no evento dela) sem
      # estar no público restrito exigia abrir "👥 Público restrito" e
      # buscar+clicar em cada pessoa, nome por nome, até duas vezes (lista da
      # turma e lista do evento). O aviso que já lista essas pessoas ganhou
      # um botão que grava todo mundo dele de uma vez.
      - name: Público restrito — incluir todos de uma vez no aviso de divergência
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-publico-restrito-incluir-todos.js

      # Hermético. Selo/botão de público restrito usava o MESMO texto pro
      # evento e pra turma — uma turma restrita mostra 1 elemento (o dela),
      # um evento restrito mostra 2 (selo + botão), e sem dizer "do evento"
      # ou "desta turma" dava pra empilhar até 3 menções idênticas sem saber
      # qual era qual.
      - name: Público restrito — selo e botão dizem de qual nível são (evento ou turma)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-publico-restrito-rotulo-nivel.js

      # Hermético. Não existia critério pra ordem de exibição quando a
      # pessoa é destinatária de mais de uma oferta ao mesmo tempo — tudo
      # saía só na ordem manual do admin. O que é mais exclusivo PARA QUEM
      # está vendo (só-diretores, depois lista restrita da qual ela faz
      # parte) agora vem antes do que é aberto a todo mundo.
      - name: Ordem da vitrine por exclusividade para quem vê (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-ordem-vitrine.js

      # Hermético também. Regra: depois de tocar em "Enviar pedido", alguma
      # coisa SEMPRE muda na tela. A regressão de 11/09/2026 era justamente o
      # contrário — botão desabilitado com cara de botão vivo, toque engolido,
      # nenhuma mensagem — e no computador do escritório passava despercebida.
      - name: "Enviar pedido nunca fica calado (desktop e iPhone)"
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-pedido-envio.js

      # Hermético. Prova que corrigir um cadastro chega em TODAS as cópias do
      # nome/área (inscrição, presença, fila, listas, equipe) — e não só em
      # fa-users, que é a versão da feature que passaria despercebida.
      - name: Editar cadastro chega em todo lugar (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-editar-cadastro.js

      # Hermético. A linha da aba Cadastrados tinha uma coluna por ação e não
      # cabia na tela: os últimos botões ficavam atrás de uma rolagem lateral
      # cuja barra só aparecia no fim de uma tabela de milhares de pixels.
      # Ação que ninguém alcança é ação que não existe — e isso não dá erro.
      - name: Ações do cadastrado cabem na tela e gravam (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-acoes-cadastrado.js

      # Hermético. O Dashboard passou a responder por evento e por turma. Um
      # número agregado errado é pior que número nenhum: ele parece certo, e
      # nada na tela acusa se o filtro deixar de filtrar. As notas do banco
      # falso são escolhidas para que cada escopo tenha média diferente.
      - name: Dashboard por evento e por turma (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-dashboard-escopo.js

      # Hermético. Minha Área: contagem de turmas por fase e lista de espera
      # por evento. Um selo "1" sozinho ao lado de "Em andamento" não diz o
      # que conta; e quem espera por mais de um evento via só UM cartão
      # genérico (fa-espera guarda uma entrada por evento, a tela só lia a
      # mais antiga) — os outros somem em silêncio, sem dizer nem que
      # existem.
      - name: Minha Área — contagens e lista de espera por evento (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-minha-area-fila.js

      # Hermético. Turma de encontro único mostrava "Encontros: 22" — sem a
      # vírgula/"e" que uma lista de datas dá de graça, o número sozinho lia
      # como se "Encontros" fosse uma contagem (22 encontros!), não uma
      # data. Mesma classe de bug já corrigida no card da página Turmas.
      - name: "Minha Área — dia do mês sempre rotulado, singular e plural (desktop e iPhone)"
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-minha-area-dia-rotulo.js

      # Hermético. O conteúdo do treinamento passou a poder ser escrito no
      # painel. Duas maneiras silenciosas de quebrar a tela de quem responde:
      # conteúdo pela metade chegando a ela, e a escada de patentes de um
      # treinamento aparecendo em outro (ela era HTML fixo).
      - name: Treinamento com conteúdo próprio (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-treinamento-conteudo.js

      # Hermético. As caixas de texto rico do Roteiro decidem se um valor é
      # HTML novo ou texto puro antigo olhando só se tem alguma tag — nunca
      # se já tem uma entidade (&amp; &nbsp;). Um "&" sem tag nenhuma era
      # escapado de novo TODA vez que a atividade era aberta e salva, mesmo
      # sem editar aquele campo — depois de duas rodadas virava um
      # "&amp;nbsp;" literal na tela, sem erro algum.
      - name: Abrir e salvar sem editar não corrompe texto com "&" (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-roteiro-texto-rico.js

      # Hermético. Turmas e Minha Área: cada turma virou um acordeão
      # (<details>/<summary>, mesmo idioma do Manual) porque com duas ou
      # mais turmas/eventos a fronteira entre um e outro não ficava clara —
      # borda quase invisível no tema escuro em Minha Área, e um bloco
      # "A Missão" inteiro entre um evento e o próximo na aba Turmas. O
      # cabeçalho fechado agora É a fronteira.
      - name: Turmas e Minha Área — acordeão de turma não mistura uma com a outra (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-turmas-expansiveis.js

      # Hermético. O card de turma mostra só o número do dia embaixo do mês.
      # Com 2+ datas a vírgula/"e" dá a pista de que é uma lista; com uma
      # data só, o número ficava sozinho e não lia como dia nenhum — "16"
      # parecia um valor perdido. "dia"/"dias" na frente resolve os dois
      # casos com a mesma regra.
      - name: "Turmas — dia do mês sempre rotulado, singular e plural (desktop e iPhone)"
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-turmas-dia-rotulo.js

      # Hermético. O card de turma mostrava "9h – 13h" fixo no código pra
      # qualquer turma, sem campo nenhum no painel para diferenciar. Agora
      # cada turma tem seu próprio horário, editável em "✎ Editar turma",
      # com 09:00–13:00 como padrão pra turma criada antes deste campo
      # existir — cobre o fluxo completo: abrir com o padrão certo, recusar
      # término antes do início, gravar o horário novo e refletir no card
      # público.
      - name: "Turmas — horário de início/término por turma, editável no painel"
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-turma-horario.js

      # Hermético. A correção de e-mail é o caminho mais arriscado do painel:
      # troca o login da pessoa no Auth e depois move TODOS os dados dela de
      # uma chave para outra. Errar aqui não dá erro na tela — a pessoa só
      # descobre depois, sem inscrição, sem presença, sem os próprios pedidos.
      - name: Corrigir e-mail leva os dados junto (desktop e iPhone)
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
        run: node .github/scripts/teste-corrigir-email.js

      - name: Rodar suíte "Automáticos" de testes.js
        env:
          NODE_PATH: /tmp/pw-deps/node_modules
          FA_BASE_URL: http://127.0.0.1:8811
          FA_TEST_ADMIN_EMAIL: ${{ secrets.FA_TEST_ADMIN_EMAIL }}
          FA_TEST_ADMIN_PASSWORD: ${{ secrets.FA_TEST_ADMIN_PASSWORD }}
        run: node .github/scripts/run-testes-automaticos.js

      - name: Guardar screenshot de erro (se houver)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testes-automaticos-erro
          path: testes-automaticos-erro.png
          if-no-files-found: ignore
